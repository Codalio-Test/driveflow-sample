# DriveFlow scheduled work.
#
# `rental_overdue_sweeper` flips live contracts to `overdue` once the
# authoritative 60-minute grace period has expired and raises the operational
# alert (PRD AC-82 / Extra AC-107).
development:
  rental_overdue_sweeper:
    class: RentalOverdueSweeperJob
    schedule: every 15 minutes

test:
  rental_overdue_sweeper:
    class: RentalOverdueSweeperJob
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  rental_overdue_sweeper:
    class: RentalOverdueSweeperJob
    schedule: every 15 minutes
